<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="https://cdn.jsdelivr.net/gh/gn-math/gn-math.github.io@main/">
  <title>GN-Math Games</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(20, 20, 20, 0.95);
      border-bottom: 1px solid #333;
      backdrop-filter: blur(12px);
    }
    #header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    #header span {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>GN-Math Games</h1>
    <span>Powered by GN-Math</span>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/gn-math/gn-math.github.io@main/gnmath.js"></script>
</body>
</html>
